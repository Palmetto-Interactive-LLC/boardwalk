name: PI Checks
on:
  pull_request:
permissions: {}
concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@9d1ad406a62908ebf904a18613371ea669e04d33 # v1
    with:
      stack: docs
