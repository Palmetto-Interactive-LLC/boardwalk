name: PI Checks
on:
  pull_request:
permissions: {}
concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@d7c8077f09cfeffc3cf660081c9499c0911826c5 # v1
    with:
      stack: docs
