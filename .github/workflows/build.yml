name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The one GitHub-hosted job left in the repo (Palmetto CI standard
    # exception): Boardwalk.app needs macOS, and CodeBuild has macOS only on
    # reserved Mac fleets. Hosted runners are free for this public repo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Boardwalk.app
        run: ./scripts/build.sh
      - name: Check the bundle
        run: |
          test -x build/Boardwalk.app/Contents/MacOS/Boardwalk
          test -f build/Boardwalk.app/Contents/Resources/AppIcon.icns
          plutil -lint build/Boardwalk.app/Contents/Info.plist
          codesign --verify --verbose build/Boardwalk.app
